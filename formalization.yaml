    - {source: "Kotzig 1955", lean: "KotzigTheorem.kotzig", module: "KotzigChallenge", status: "proved"}
    - {source: "Wernicke 1904", lean: "KotzigTheorem.wernicke", module: "KotzigChallenge", status: "proved"}

